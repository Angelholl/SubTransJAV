# 幻觉/噪音删除模式配置

# 视频元信息关键词（片尾结束语、求订阅点赞等）
video_meta:
  # 强元信息词 — 单独命中即删除（几乎不会在剧情对话出现）
  strong:
    - 感谢观看
    - 感谢收看
    - 感谢您的聆听
    - 感谢各位的收听
    - 感谢各位的观看
    - 感谢您的收看
    - 观看至最后
    - 看到最后
    - 观看到最后
    - 观看本视频
    - 敬请期待
    - 订阅
    - 点赞
    - 记得订阅
    - 记得点赞
    - 请订阅
    - 请期待
    - 今天就到这里
    - 到此结束
    - 以上结束
    - 以上就
    - 就到这里结束
    - 片尾
    - 片尾曲
    - 未完待续
    - 待续
    - 下集待续
    - 下集预告
    - 下回预告
    - 谢谢大家
    - 谢谢观看
    - 非常感谢

  # 弱元信息词 — 必须与至少一个强元信息词同条才删除
  weak:
    - 再见
    - 再会
    - 辛苦了
    - 休息一下
    - 祝您
    - 祝你
    - 祝大家
    - 美好的一天
    - 愉快

# 垃圾符号/乱码正则（整行匹配）
garbage:
  - '^[.。!！?？,，、:：;；…]+$'
  - '^，$'
  - '^。$'
  - '^！$'
  - '^？$'
  - '^…+$'
  - '^……$'
  - '^:$'
  - '^：$'
  - '^[-—~～\s]+$'
  - '^[☆★❤♪💕💛]+$'
  - '^拜拜[！!]?$'
  - '^（）$'
  - '^\(\)$'
  - '^[😊😍😂🐈🐑🐕🐶🐼]+$'

# 括号描述正则
parenthetical: '^[（(][^）)]{1,20}[）)]$'
