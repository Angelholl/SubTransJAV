# 闸门0——送翻前源侧幻觉检测 默认规则库
# =====================================
# 消费方：subtransjav/refine/source_hallucination.py（唯一实现）。
# 用户覆盖：config/rules/source_hallucination.yaml 存在则整文件替换
# 本默认库（仓库惯例：整文件替换，不做深层合并）。
#
# 规约（R7 评议结论）：
# - schema_version：规则结构版本（结构不兼容变更时递增），当前为 1；
# - 每个检测类别必须携带 example 证据样本字段（供测试与文档引用，
#   防无据规则膨胀）；
# - keep_list 与 language_validator._WHITELIST_JA 并集保持同一口径：
#   命中 keep_list（规范化后整条精确匹配）的条目任何档位都不删不计数，
#   优先级高于一切档位规则。

schema_version: 1

