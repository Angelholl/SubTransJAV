# =============================================================================
# 翻译规则单一数据源（Single Source of Truth）
# =============================================================================
# 维护说明：本文件是全仓库唯一的翻译规则定义处。
#   - validator_rules  → 代码层校验器（refine/post_validate.py）读取
#   - prompt_sections  → 角色卡/阶段提示词生成（refine/instructions.py）读取
# 维护频次：仅在更换本地主力模型时复核一次；日常自动化流程零维护。
# 一致性保障：tests/test_rules_loader.py 会校验本文件可加载、必需键齐全，
#   且生成的提示词文本与代码期望逐字节一致（防止 YAML 与代码漂移）。
# =============================================================================

meta:
  version: 1
  # 当前调参所针对的本地主力模型；换模型时复核下方规则是否仍必要
  tuned_for_model: "generic-local-llm"
  notes: >-
    validator_rules 中的误译修正规则针对本地小模型的已知系统性误译。
    云端强模型模式下建议 post_validate 使用 lenient 档（仅格式/语言校验）。

# -----------------------------------------------------------------------------
# 代码层校验规则（refine/post_validate.py 消费）
# 每条规则：source_*/target_* 定义触发条件，replacement/warn_only 定义动作。
# -----------------------------------------------------------------------------
validator_rules:

  # で误译检测：目标含"作为"且源文含「で」但不含「として」时，
  # 判定为判断助动词だ连用形被误译，直接替换为"是"并计入修正数。
  # 影响范围：阶段A/B 后验输出（日译中阶段）。
  dewei_mistranslation:
    description: で（判断助动词だ连用形）误译为"作为"
    target_pattern: "作为"
    source_must_contain: "で"
    source_must_not_contain: "として"
    replacement: "是"
    warn_only: false

  # 主语误判检测：源文含僕たち/私たち/俺たち+名词+で（定语构造）而译文
  # 以单数"我是/俺是"开头才告警（僕たち/私たち…で 复数代词误译为单数
  # 主语）；"我们是…"为正确方向不告警（定语读法"我们的…"由角色卡规则
  # 防护，负向前瞻 (?![们們等]) 排除复数）。
  # 注意 source 特意要求后面接「で」（中顿）：僕たちは部長だ→"我们是部长"
  # 是正确翻译，不能误伤；间隔字符排除换行（条目均为单行，无影响）。
  # 片假名变体（ボク/ワタシ/オレ）一并覆盖，ASR 字幕常见。
  # 主语推断需上下文，仅告警不改译文。
  # 影响范围：日志告警（Logs/）+ 质量报告"校验告警"清单。
  subject_misjudge:
    description: 僕たち/私たち+名词+で 定语结构被误译为单数"我是/俺是"开头
    source_pattern: '(?:僕|私|俺|ボク|ワタシ|オレ)たち(?!は).{0,12}で'
    target_pattern: '^\s*(?:我|俺)(?![们們等])\s*[，,、]?\s*(?:是|成了)'
    warn_only: true

  # 反义误译检测（批次 B2，冻结契约 D2026-0917-01 ③）：双侧锚定——源文
  # 命中指定形态 且 译文命中目标集才告警；warn_only=true 仅进质量报告
  # 复核清单 + 经既有 flagged_indexes 机制阻断该翻译对进入 TM 学习，
  # 不改动译文。
  # 反义规则仅 local/strict 档生效（post_validate 既有执行条件：
  # _apply_fallback_rules 在 cloud/lenient 档整层跳过，无需单独开关）。
  # 影响范围：质量报告"校验告警"复核清单 + TM 学习准入（validator 类跳过）。
  antonym_yamete:
    description: やめて 禁止默认译'别停/不要停'，优先'住手/停下'，按语境裁定；やめないで 才是'别停'；仅 local/strict 档生效
    # 负向排除 やめないで/やめるな：やめないで→"别停"是正确翻译不得告警
    source_pattern: 'やめ(?!ないで)(?!るな)(?:て|ろ)'
    target_pattern: '(?:别停|不要停)(?:下来)?'
    warn_only: true

  antonym_saitei:
    description: 日语口语 最低=差劲，译成正面评价即反义；仅 local/strict 档生效
    source_pattern: '最低'
    target_pattern: '(?:真不错|真棒|不错|挺好)'
    warn_only: true

  antonym_zurui:
    description: ずるい/ずりー=狡猾/不公平，非"滑"；仅 local/strict 档生效
    source_pattern: 'ずるい|ずりー'
    target_pattern: '滑'
    warn_only: true

  # 身体部位误译检测（批次 B 闭环）：身体语境下 首=脖子（不是头）。双侧锚定
  # 与 antonym_* 同构（批次 B2 既有机制）：源文命中 首 且 译文命中
  # 摸头/揉头/头上/头发 才告警；warn_only=true 仅进质量报告复核清单 +
  # 经既有 flagged_indexes 机制阻断该翻译对进入 TM 学习，不改动译文。
  # 仅 local/strict 档生效（_apply_fallback_rules 既有执行条件）。
  # 影响范围：质量报告"校验告警"复核清单 + TM 学习准入（validator 类跳过）。
  body_part_kubi:
    description: 身体语境 首=脖子非头；习语负向排除；仅 local/strict 档生效
    # 负向排除习语/抽象形态：首が回らない/首を長くする/首になる/首をかしげる
    source_pattern: '首(?!が回ら)(?!を長く)(?!になる)(?!をかしげ)'
    target_pattern: '(?:摸头|揉头|头上|头发)'
    warn_only: true

  # イク系变体高潮语境复核（批次 B 闭环）：イク 已由 glossary 强制译"要去了"，
  # 本规则捕获 glossary 子串匹配不到的假名变体（イっ/イきそう/イく/いっちゃう）
  # 译出高潮类目标时的复核（いっちゃう 口语中亦可能为 行く+ちゃう，需人裁定）。
  # 汉字 行く/行きます/行った/行こう 显式负向排除（契约要求）；イク 精确形态
  # 一并负向排除（glossary 译法本身不告警）。双侧锚定 + warn_only，同 B2 既有
  # 行为；仅 local/strict 档生效。
  climax_iku_variant:
    description: イク系变体仅高潮语境复核（いっちゃう 口语亦可能为行く+ちゃう）；普通'去'不受影响；仅 local/strict 档生效
    # 前瞻负向排除：普通"去"类汉字形态 + glossary 精确形态イク
    source_pattern: '(?!行く|行きます|行った|行こう|イク)(?:イっ|イきそう|イく|イク|いっちゃう)'
    target_pattern: '(?:要去了|快去了|要高潮了|快高潮了)'
    warn_only: true

# -----------------------------------------------------------------------------
# 提示词生成段（refine/instructions.py 消费）
# 消费点：
#   - sentence_final_particles → STAGE_PROMPTS[1]（阶段2 日译中）中的规则行
#   - retry_cleaning          → 阶段3/抛光阶段的 ### retry_instructions 段
#   - hardened_suffix         → 阶段4（中文抛光）硬性豁免段
# 注意：改这里会直接改变发给 LLM 的提示词，务必跑 tests/test_rules_loader.py。
# -----------------------------------------------------------------------------
prompt_sections:

  # 阶段2（日译中）提示词中的句末助词硬规则行。
  # 必须保持单行（YAML 折叠标量会在换行处插入空格，破坏逐字节一致性）。
  sentence_final_particles: "- 句末助词处理：「で」(中顿/判断助动词だ的て形)→末尾加省略号，且必须补为「是…也是…」结构，严禁译为「作为…」（除非原文为として）；「けど/が」→译为不过/但是；「し」→译为而且；终助词「よ/ね」→用哦/呢/啊体现"

  # 抛光阶段（阶段4）专用重试指令：覆盖引擎默认"每行必须有译文"，
  # 保护"留空=有意删除"语义不被重试回填。
  retry_cleaning: |
    ### retry_instructions
    上一次回复存在格式问题。请按编号协议重新逐条输出（#<编号> / Translation> / 正文）。
    重要：Translation> 后留空表示该条目被有意删除（ASR噪音/填充/幻觉），这些条目必须保持留空，严禁为其编造或回填内容。
    只需修复格式错误、编号错位，以及真正漏掉的、带实义内容的条目。
    特别检查：①翻译中出现'作为'而原文无「として」时，必须修正为'是……也是……'结构；②原文含「僕たち/私たち」而译文以'我是'开头时，必须修正为正确主语（'我们的'或根据上下文补出）。

  # 阶段4（中文抛光）硬性豁免段：绝对优先级保护关键词/模式，防止误删
  hardened_suffix: |
    【硬性豁免规则 - 绝对优先级，覆盖所有删除标准】
    以下规则优先于删除标准中的任何判断。当删除标准与本豁免冲突时，必须保留。
    （删除标准中的任何规则不得覆盖本豁免。）

    保护关键词（包含任一即强制保留）：
    舒服、好舒服、太舒服、真舒服、不行、不要、不要了、够了、停下、停、
    厉害、好厉害、太厉害、真厉害、棒、好棒、痛、好痛、痛死了、
    那里、这里、哪里、拜托、求你、求你了、慢点、轻点、
    啊、啊啊、嗯、唔、哼、噢、哦、呜、
    姐姐、哥哥、前辈、部长、先生、
    喜欢、最喜欢、爱你、爱、想你、要你、
    好热、好大、好深、好多、好涨、好紧、好软、好硬、好湿、
    去了、要去了、到了、不行了、受不了、受不了了、
    可以、可以吗、好了、好了吗、没事、没事吧、别怕、放心、
    再来、继续、不要停、别停、快点、用力、再深一点

    保护模式（匹配任一即强制保留）：
    - 包含省略号（……）或语气延长符（～）的短句
    - 包含感叹号（！）或问号（？）的短句
    - 连续重复的感叹词或语气词（如"啊啊啊"、"嗯嗯"）
    不确定时 → 强制保留，不得删除。
