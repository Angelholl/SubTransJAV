# HARDENED 豁免词表 — 仅保留亲密/成人场景强相关、极易被误删的词
# 原则：只保护那些可能被删除规则误伤的词汇，不保护"喜欢""爱""可以"等正常对话词

# 精确关键词（子串匹配命中即保留）
keywords:
  # 感官感受（孤立会触发删除规则7）
  - 好舒服
  - 太舒服
  - 好紧
  - 好深
  - 好涨
  - 好软
  - 好硬
  - 好湿
  - 好滑
  - 好烫
  - 好胀
  - 好酸
  - 好麻
  - 好爽
  - 好痛
  - 痛死了
  # 情绪高潮（孤立会触发删除规则7/9）
  - 不行了
  - 要去了
  - 要到了
  - 受不了
  - 受不了了
  # 位置/动作指示（孤立可能触发删除规则11）
  - 深处
  # 亲密请求（孤立可能触发删除规则9/10）
  - 再用力
  - 再深一点
  - 快一点
  - 慢点
  - 轻点
  - 不要停
  - 别停
  # 称呼（孤立可能触发删除规则11）
  - 姐姐
  - 哥哥
  - 前辈
  - 先生
  - 妹妹
  - 弟弟
  - 老师
  - 主人
  - 爸爸
  - 妈妈
  - 阿姨
  - 叔叔
  - 爷爷
  - 奶奶

# 复合结构正则（匹配即保留）
patterns:
  - '好[软紧滑烫深胀酸麻]'
  - '(再|快|慢|轻)点'
  - '不要停'
  - '别停'
