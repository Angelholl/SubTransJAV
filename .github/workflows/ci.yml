name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: line-endings
        shell: bash
        run: if grep -rlU $'\r' --include='*.py' --include='*.yaml' subtransjav config tests; then echo "::error::CRLF line endings detected"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check subtransjav tests
      # mypy report-only（分阶段策略：阶段一仅采集基线不阻断；阶段二收口时去掉 || true 改为门禁）
      - name: Type check (report-only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: mypy subtransjav || true
      - name: Test
        shell: bash
        run: python -m pytest tests -q --cov=subtransjav --cov-report=term
