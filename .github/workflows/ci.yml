name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: line-endings
        shell: bash
        run: if grep -rlU $'\r' --include='*.py' --include='*.yaml' subtransjav config tests; then echo "::error::CRLF line endings detected"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]" && pip install "mypy==2.3.1"
      - name: Lint
        run: ruff check subtransjav tests
      # mypy 基线门禁（D9，1.3.1 收口：去 || true，基线外错误即阻断）
      - name: Type check (baseline gate)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python tools/mypy_baseline.py --check
      - name: Test
        shell: bash
        run: python -m pytest tests -q --cov=subtransjav --cov-report=term
