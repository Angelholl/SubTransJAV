name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: line-endings
        shell: bash
        run: if grep -rlU $'\r' --include='*.py' --include='*.yaml' subtransjav config tests; then echo "::error::CRLF line endings detected"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check subtransjav tests
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=line -rf -p no:cacheprovider 2>&1 | tee /tmp/pytest_out.txt
          code=$?
          grep -E "^(FAILED|ERROR)" /tmp/pytest_out.txt | head -40 | sed 's/^/::error::/' || true
          tail -5 /tmp/pytest_out.txt | sed 's/^/::notice::/'
          exit $code
